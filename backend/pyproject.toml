[project]
name = "recruitbd-ai"
version = "0.1.0"
description = "RecruitBD-AI is an AI-powered CV parsing and job matching platform."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiohttp>=3.14.1",
  "bs4>=0.0.2",
  "fastapi>=0.137.2",
  "google-genai>=2.9.0",
  "numpy>=2.4.6",
  "ollama>=0.6.2",
  "pdfplumber>=0.11.10",
  "pytest>=9.1.1",
  "python-docx>=1.2.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.32",
  "sentence-transformers>=5.6.0",
  "tqdm>=4.68.3",
  "uvicorn>=0.49.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.12.1"]
cuda = ["torch>=2.12.1"]

[dependency-groups]
dev = ["pre-commit>=4.6.0"]

[tool.pytest]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
