version: 2
updates:
  - package-ecosystem: uv
    directory: backend
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      all:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: backend
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      all:
        patterns:
          - "*"
